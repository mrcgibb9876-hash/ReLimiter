# Build and check on every branch and pull request.
#
# release.yml only runs on main and skips itself when the tag already exists, so a change pushed to a
# branch was never compiled by anything. The host API needs that: it is a new translation unit with a
# dllexport, and MSVC is the compiler that decides whether it is right.
#
# The API test builds and runs here too, off a game and off a GPU. It defines its own Config and
# ApplyConfig/SaveConfig, so it links against api.cpp alone -- config.cpp is deliberately not in the
# link, which is also what keeps the test from needing the rest of ReLimiter.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cheapest check first, and the one that catches the failure that is otherwise silent: a setting
      # added to Config that the host-API registry does not list simply never appears in a host UI.
      - name: Host API registry matches struct Config
        run: python tools/check_api_registry.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure (64-bit)
        run: cmake -B build -A x64

      - name: Build (64-bit)
        run: cmake --build build --config Release

      - name: Configure (32-bit)
        run: cmake -B build32 -A Win32

      - name: Build (32-bit)
        run: cmake --build build32 --config Release

      # What the build actually produced. The paths below were taken from release.yml, which has
      # never run to completion -- it skips itself whenever the tag already exists, which it always
      # does -- so they were never verified by anything. Listed before they are used, so a wrong path
      # says so instead of looking like a missing export.
      - name: List what was built
        shell: pwsh
        run: |
          foreach ($root in @('build', 'build32')) {
            Get-ChildItem -Path $root -Recurse -Include *.addon64,*.addon32,*.dll -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.FullName.Replace((Get-Location).Path + '\\',''))  $([math]::Round($_.Length/1MB,2)) MB" }
          }

      # The exported entry point is the whole contract with a host: missing or decorated, a host's
      # GetProcAddress finds nothing and the failure lands at runtime in somebody's game.
      #
      # Read out of the PE export directory rather than by shelling out to dumpbin. dumpbin needs the
      # VC environment loaded to run at all -- without it it launches and produces nothing, which is
      # how the first version of this step "failed" on a DLL whose exports were in fact fine.
      - name: ReLimiterGetApi is exported undecorated
        shell: pwsh
        run: |
          $a64 = (Get-ChildItem build -Recurse -Filter *.addon64 | Select-Object -First 1).FullName
          $a32 = (Get-ChildItem build32 -Recurse -Filter *.addon32 | Select-Object -First 1).FullName
          if (-Not $a64) { Write-Error 'no .addon64 was produced anywhere under build/'; exit 1 }
          if (-Not $a32) { Write-Error 'no .addon32 was produced anywhere under build32/'; exit 1 }
          python tools/check_exports.py $a64 ReLimiterGetApi --stdcall-ok AddonInit AddonUninit
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/check_exports.py $a32 ReLimiterGetApi --stdcall-ok AddonInit AddonUninit
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # api.cpp falls back to "unknown" when RELIMITER_VERSION_STRING is not defined, and the test only
      # asserts the version is non-empty -- so the define is left out rather than threaded through two
      # layers of PowerShell and cmd quoting, which is what broke the first attempt at this step.
      - name: Build and run the host API test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /Fe:api_test.exe tests\api_test.cpp src\api.cpp || exit /b 1
          api_test.exe || exit /b 1

      - name: Upload the built add-ons
        uses: actions/upload-artifact@v4
        with:
          name: relimiter-addons
          path: |
            build/bin/Release/relimiter.addon64
            build32/bin/Release/relimiter.addon32
          if-no-files-found: error
